services:
  neo4j:
    image: neo4j:5.26-community
    container_name: fraudelink_neo4j
    ports:
      - "7474:7474"   # Neo4j Browser (interfaz web, http://localhost:7474)
      - "7687:7687"   # Bolt: el puerto que usa el driver de Python
    environment:
      # La contraseña se lee del archivo .env (ver .env.example).
      # NUNCA se escribe directamente aquí ni se sube al repositorio.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      # Instala automáticamente los plugins al arrancar el contenedor:
      # APOC (funciones extra de Cypher) y Graph Data Science (GDS),
      # necesario más adelante para centralidad y comunidades.
      NEO4JLABS_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
    volumes:
      # Los datos persisten aunque se apague el contenedor
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs:
